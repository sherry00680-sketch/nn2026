<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重要詢問 ✨</title>

    <!-- ========================================== -->
    <!-- 這裡就是完美的 LINE 防劇透、偽裝心理測驗標籤 -->
    <!-- ========================================== -->
    <meta property="og:title" content="✨ 2026 潛意識心理測驗" />
    <meta property="og:description" content="點擊連結開始測試，探討你內心深處最真實的渴望與性格特質..." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1518133683791-0b9de5a055f0?w=500" />
    <meta property="og:type" content="website" />
    <!-- ========================================== -->

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #ffe6e6;
            overflow: hidden;
        }

        h1 {
            color: #d63031;
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            line-height: 1.4;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 40px;
            position: relative;
            height: 60px;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff7675;
            color: white;
        }

        #yesBtn:hover {
            background-color: #d63031;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #b2bec3;
            color: white;
            position: absolute; 
            left: 120px; 
            white-space: nowrap;
            touch-action: none; /* 防止手機滑動干擾 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>請問這個禮拜日<br>有沒有空跟我約會呢？ 💓</h1>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="agree()">要要要 ( 💗 )</button>
            <button id="noBtn" onmouseover="escape()" onclick="escape()" ontouchstart="escape()">不要 ( ❌ )</button>
        </div>
    </div>

    <script>
        function escape() {
            const noBtn = document.getElementById('noBtn');
            
            // 計算視窗可容納的寬高，扣除按鈕本身長寬避免出界
            const maxX = window.innerWidth - noBtn.offsetWidth - 25;
            const maxY = window.innerHeight - noBtn.offsetHeight - 25;
            
            // 隨機產生新的座標
            const randomX = Math.max(25, Math.floor(Math.random() * maxX));
            const randomY = Math.max(25, Math.floor(Math.random() * maxY));
            
            // 將按鈕改為相對於整個視窗絕對定位
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function agree() {
            alert("可以不要奧嘟嘟了    期待見我就可以 🥰");
        }
    </script>

</body>
</html>
